<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        #title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .settings {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
        }

        #winningScoreHeader {
            color: #34495e;
            font-weight: 600;
        }

        #playTo {
            padding: 8px 12px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            background: white;
            color: #2c3e50;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        #playTo:hover {
            border-color: #3498db;
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.2);
        }

        .display {
            text-align: center;
            margin-bottom: 30px;
            min-height: 40px;
        }

        #display {
            color: #27ae60;
            font-size: 1.5em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .players-container {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .player {
            flex: 1;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            transition: transform 0.3s ease;
        }

        .player:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .player h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .score-display {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #ecf0f1;
        }

        .score-display h3 {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        #p1Score,
        #p2Score {
            font-size: 2.5em;
            font-weight: bold;
            color: #3498db;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #p1Correct,
        #p2Correct {
            background: #27ae60;
            color: white;
        }

        #p1Correct:hover,
        #p2Correct:hover {
            background: #229954;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        #p1Correct:disabled,
        #p2Correct:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        #p1Wrong,
        #p2Wrong {
            background: #e74c3c;
            color: white;
        }

        #p1Wrong:hover,
        #p2Wrong:hover {
            background: #c0392b;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        #p1Wrong:disabled,
        #p2Wrong:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .controls {
            text-align: center;
            margin-top: 30px;
        }

        #reset {
            background: #3498db;
            color: white;
            padding: 14px 40px;
            font-size: 1.1em;
        }

        #reset:hover {
            background: #2980b9;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .winner {
            background: #d5f4e6;
            border-left-color: #27ae60 !important;
        }

        .winner h2 {
            color: #27ae60;
        }

        .loser {
            background: #fadbd8;
            border-left-color: #e74c3c !important;
        }

        .loser h2 {
            color: #e74c3c;
        }

        @media (max-width: 600px) {
            .players-container {
                flex-direction: column;
                gap: 20px;
            }

            .container {
                padding: 20px;
            }

            #title {
                font-size: 1.8em;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="title">Simple Quiz Score Tracker</h1>

        <div class="settings">
            <h4><span id="winningScoreHeader">Select Winning Score : </span>
                <select name="" id="playTo">
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                </select>
            </h4>
        </div>

        <div class="display">
            <h4 id="display"></h4>
        </div>

        <div class="players-container">
            <!-- player 1 -->
            <div class="player">
                <h2 id="p1Name">Player 1</h2>
                <div class="score-display">
                    <h3>Score</h3>
                    <span id="p1Score">0</span>
                </div>
                <div class="button-group">
                    <button id="p1Correct">Correct</button>
                    <button id="p1Wrong">Wrong</button>
                </div>
            </div>

            <!-- player 2 -->
            <div class="player">
                <h2 id="p2Name">Player 2</h2>
                <div class="score-display">
                    <h3>Score</h3>
                    <span id="p2Score">0</span>
                </div>
                <div class="button-group">
                    <button id="p2Correct">Correct</button>
                    <button id="p2Wrong">Wrong</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="reset">Reset Game</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
