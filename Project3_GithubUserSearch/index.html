<!DOCTYPE html>
<html lang="en">

<head>

    <title>Mini Project</title>
</head>

<body>
    <h2>GitHub User Search</h2>

    <h5 id="repoHeader"></h5>
    <li id="reposList"></li>

    <!-- script to use axios -->

    <script src="script.js"></script>
